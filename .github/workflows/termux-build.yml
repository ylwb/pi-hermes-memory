name: Termux Build

on:
  workflow_dispatch:
    inputs:
      skip_test:
        description: "Skip tests (faster build)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  build-termux:
    name: Build for Termux (ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run check

      - name: Run tests (optional)
        if: github.event.inputs.skip_test != 'true'
        run: npm test
        continue-on-error: true

      - name: Create package artifact
        run: |
          npm pack
          ls -lh *.tgz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-hermes-memory-termux
          path: "*.tgz"
          retention-days: 7
