name: Termux Build

on:
  push:
    branches: [main, termux]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_test:
        description: "Skip tests (faster build)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  build-termux:
    name: Build for Termux (ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install --prefer-offline
          # Force better-sqlite3 to download arm64 prebuild
          npm rebuild better-sqlite3 --build-from-source=false 2>/dev/null || true
          # Verify better-sqlite3 bindings
          node -e "const bs = require('better-sqlite3'); console.log('better-sqlite3 OK:', bs.Database.toString().slice(0, 50))"

      - name: Type check
        run: npm run check

      - name: Run tests (optional)
        if: github.event.inputs.skip_test != 'true'
        run: npm test
        continue-on-error: true

      - name: Create package artifact
        run: |
          mkdir -p dist
          # Copy source (Pi loads .ts directly via tsx)
          cp -r src dist/
          cp -r scripts dist/
          cp package.json dist/
          cp README.md dist/
          cp LICENSE dist/
          cp docs dist/ -r
          # Copy node_modules (excluding devDeps for smaller size)
          npm pack --pack-destination dist/ 2>/dev/null || true
          # Create installable tarball
          tar -czf pi-hermes-memory-termux.tar.gz \
            dist/ \
            package.json \
            README.md \
            LICENSE \
            .github/ \
            src/ \
            scripts/ \
            tests/ \
            docs/ \
            tsconfig.json
          ls -lh pi-hermes-memory-termux.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-hermes-memory-termux
          path: pi-hermes-memory-termux.tar.gz
          retention-days: 7

  build-arm64:
    name: Build native modules (ARM64 Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build better-sqlite3 for linux-arm64
        run: |
          # Download prebuilt binary for linux-arm64
          npx prebuild-install --runtime napi --target 24.0.0 --arch arm64 --platform linux --download https://github.com/JarvusIntelliSystems/better-sqlite3/releases/latest/download/better-sqlite3-v12.9.0-node-v141-linux-arm64.tar.gz 2>/dev/null || \
          npm rebuild better-sqlite3 --build-from-source=false 2>/dev/null || \
          echo "Prebuild install skipped, using npm cached binary"
          ls -la node_modules/better-sqlite3/build/Release/ 2>/dev/null || echo "No prebuilt binary found"

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: better-sqlite3-arm64
          path: node_modules/better-sqlite3/build/Release/
          retention-days: 7
